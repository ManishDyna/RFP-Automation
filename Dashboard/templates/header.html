<header class="bg-white shadow-sm border-bottom">
    <div class="container-fluid">
        <div class="row align-items-center py-3">
            <div class="col-md-6">
                <div class="d-flex align-items-center" style="
                font-size: 25px;
                font-weight: 750;
            ">
                    <div class="brand-logo-container me-3">
                        <div class="brand-logo-circle">
                            <img src="/static/images/bahra-electric-logo.png" alt="Bahra Electric Logo" class="brand-logo">
                        </div>
                    </div>
                    <div>
                        <!-- <h1 class="h3 mb-0 fw-bold" style="color: #E63946;">BAHRA ELECTRIC</h1> -->
                        <p class="mb-0 small text-muted" >RFP Management System</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="d-flex align-items-center justify-content-end">
                    <!-- <button id="manualRefreshBtn" class="btn btn-outline-primary btn-sm me-2" title="Refresh Data">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button> -->
                    {% set path = request.url.path %}
                    <a class="btn btn-outline-primary btn-sm me-2" href="{{ request.url.path }}?refresh=1">
                        <i class="fas fa-sync-alt me-3"></i>Refresh Now
                    </a>
                    <button type="button" id="downloadAllRfpsBtn" class="btn btn-primary btn-sm me-2" title="Download All RFPs from All Companies">
                        <span class="btn-text">
                            <i class="fas fa-download me-2"></i>Download All RFPs
                        </span>
                        <span class="btn-loading d-none">
                            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            Running...
                        </span>
                    </button>
                    <div class="dropdown">
                        <button
                            class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center"
                            type="button" data-bs-toggle="dropdown">
                            <span class="me-2" id="userName">{{ user.name if user else 'Guest' }}</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/dashboard/profile"><i
                                        class="fas fa-user me-2"></i>Profile</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><button class="dropdown-item" id="logoutBtn"><i
                                        class="fas fa-sign-out-alt me-2"></i>Logout</button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

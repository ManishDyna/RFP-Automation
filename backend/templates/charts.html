{% extends "base.html" %}

{% block title %}Analytics{% endblock %}

{% block content %}
<div class="row mb-4">
	<div class="col">
		<h2 class="h4 mb-3">Analytics</h2>
		<p class="text-muted mb-0">Visual insights based on your dashboard data.</p>
	</div>
</div>

<!-- Charts Section -->
<div class="row g-4">
	<!-- RFPs Month-over-Month -->
	<div class="col-md-6 col-lg-4">
		<div class="card">
			<div class="card-header bg-white">
				<h5 class="card-title mb-0">
					<i class="fas fa-file-alt me-2"></i>RFPs (This vs Previous Month)
				</h5>
			</div>
			<div class="card-body">
				<canvas id="rfpMoMChart" height="150"></canvas>
			</div>
		</div>
	</div>

	<!-- Automation Month-over-Month -->
	<div class="col-md-6 col-lg-4">
		<div class="card">
			<div class="card-header bg-white">
				<h5 class="card-title mb-0">
					<i class="fas fa-robot me-2"></i>Automation (This vs Previous Month)
				</h5>
			</div>
			<div class="card-body">
				<canvas id="automationMoMChart" height="150"></canvas>
			</div>
		</div>
	</div>

	<!-- Automation Success Rate -->
	<div class="col-md-12 col-lg-4">
		<div class="card">
			<div class="card-header bg-white">
				<h5 class="card-title mb-0">
					<i class="fas fa-check-circle me-2"></i>Automation Success Rate
				</h5>
			</div>
			<div class="card-body">
				<canvas id="automationSuccessChart" height="150"></canvas>
			</div>
		</div>
	</div>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function(){
	if (!window.Chart) return;

	// RFPs: This vs Previous Month
	const rfpMoMCtx = document.getElementById('rfpMoMChart');
	if (rfpMoMCtx) {
		new Chart(rfpMoMCtx, {
			type: 'bar',
			data: {
				labels: ['Saved RFPs', 'Downloaded RFPs'],
				datasets: [
					{
						label: 'This Month',
						data: [
							{{ data.rfp.total_rfps | default(0) }},
							{{ data.rfp.downloaded_rfps | default(0) }}
						],
						backgroundColor: '#E63946'
					},
					{
						label: 'Previous Month',
						data: [
							{{ data.rfp.prev_total_rfps | default(0) }},
							{{ data.rfp.prev_downloaded_rfps | default(0) }}
						],
						backgroundColor: '#ffb3b8'
					}
				]
			},
			options: {
				plugins: { legend: { position: 'bottom' } },
				scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
			}
		});
	}

	// Automation: This vs Previous Month
	const autoMoMCtx = document.getElementById('automationMoMChart');
	if (autoMoMCtx) {
		new Chart(autoMoMCtx, {
			type: 'bar',
			data: {
				labels: ['Total Runs', 'Successful Runs'],
				datasets: [
					{
						label: 'This Month',
						data: [
							{{ data.automation.total_runs | default(0) }},
							{{ data.automation.successful_runs | default(0) }}
						],
						backgroundColor: '#C92A35'
					},
					{
						label: 'Previous Month',
						data: [
							{{ data.automation.prev_total_runs | default(0) }},
							{{ data.automation.prev_successful_runs | default(0) }}
						],
						backgroundColor: '#ffc4c8'
					}
				]
			},
			options: {
				plugins: { legend: { position: 'bottom' } },
				scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
			}
		});
	}

	// Automation Success Rate
	const successCtx = document.getElementById('automationSuccessChart');
	if (successCtx) {
		const totalRuns = {{ data.automation.total_runs | default(0) }};
		const successRuns = {{ data.automation.successful_runs | default(0) }};
		const failedRuns = Math.max(0, totalRuns - successRuns);
		new Chart(successCtx, {
			type: 'doughnut',
			data: {
				labels: ['Successful', 'Failed'],
				datasets: [{
					data: [successRuns, failedRuns],
					backgroundColor: ['#10b981', '#E63946']
				}]
			},
			options: {
				plugins: { legend: { position: 'bottom' } }
			}
		});
	}
})();
</script>
{% endblock %}

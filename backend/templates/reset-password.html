{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header"><i class="fas fa-unlock-alt me-2"></i>Reset Password</div>
                <div class="card-body">
                    <form id="resetForm">
                        <div class="mb-3">
                            <label for="newPwd" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPwd" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPwd" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPwd" required>
                        </div>
                        <button type="submit" id="resetBtn" class="btn btn-primary">
                            <span class="btn-text">Set Password</span>
                            <span class="btn-loading d-none"><span class="spinner-border spinner-border-sm me-2"></span>Saving...</span>
                        </button>
                    </form>
                    <div id="resetAlert" class="alert alert-dismissible fade mt-3" role="alert" style="display:none;">
                        <span id="resetAlertMsg"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('resetBtn');
    const txt = btn.querySelector('.btn-text');
    const load = btn.querySelector('.btn-loading');
    const alertBox = document.getElementById('resetAlert');
    const alertMsg = document.getElementById('resetAlertMsg');
    function show(msg, type){ alertMsg.textContent = msg; alertBox.className = `alert alert-${type} alert-dismissible fade show`; alertBox.style.display='block'; }
    form.addEventListener('submit', async function(e){
        e.preventDefault();
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const password = document.getElementById('newPwd').value;
        const confirm = document.getElementById('confirmPwd').value;
        if (password !== confirm) { show('Passwords do not match', 'danger'); return; }
        txt.classList.add('d-none'); load.classList.remove('d-none'); btn.disabled = true;
        try {
            const res = await fetch('/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }) });
            const j = await res.json().catch(()=>({}));
            if (!res.ok) throw new Error(j.detail || j.message || 'Failed to reset');
            show('Password has been updated. You can now login.', 'success');
            setTimeout(()=>{ window.location.href = 'http://localhost:3000/login'; }, 1200);
        } catch(err){ show(err.message, 'danger'); }
        finally { txt.classList.remove('d-none'); load.classList.add('d-none'); btn.disabled = false; }
    });
})();
</script>
{% endblock %}

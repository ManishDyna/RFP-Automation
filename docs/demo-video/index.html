// ── Picture-in-picture "real product" proof during 3 film scenes ─────────────
function FilmRealInset({ t0, dur, src, label }) {
  const time = useTime(); const lt = time - t0;
  if (lt < -0.4 || lt > dur + 0.4) return null;
  const op = clamp(lt / 0.5, 0, 1) * (1 - clamp((lt - (dur - 0.5)) / 0.5, 0, 1));
  const sc = lerp(1.05, 1.12, clamp(lt / dur, 0, 1));
  return (
    <div style={{ position: 'absolute', right: 40, bottom: 120, width: 392, opacity: op, zIndex: 40,
      transform: `translateY(${(1 - clamp(lt / 0.5, 0, 1)) * 16}px)` }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
        <span style={{ width: 8, height: 8, borderRadius: 99, background: C.red, boxShadow: `0 0 0 4px ${C.redSoft}` }} />
        <span style={{ fontFamily: F.mono, fontSize: 11, fontWeight: 700, color: C.inv, letterSpacing: '0.1em' }}>LIVE PRODUCT · {label}</span>
      </div>
      <div style={{ borderRadius: 12, overflow: 'hidden', height: 220, border: `1px solid ${C.hair2}`, boxShadow: '0 30px 70px rgba(0,0,0,0.6)', background: C.card }}>
        <img src={'assets/shots/' + src} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'top center', transform: `scale(${sc})`, transformOrigin: 'top center' }} />
      </div>
    </div>
  );
}

    window.__setTime = (x) => { tRef.current = x; setT(x); };
    window.__duration = TOTAL;
    window.__ready = true;
    // real-time autoplay path (for fast video-recording capture): window.__play()
    window.__play = () => {
      let last = null, raf;
      const step = (ts) => {
        if (last == null) last = ts;
        const dt = (ts - last) / 1000; last = ts;
        let nx = tRef.current + dt;
        if (nx >= TOTAL) { nx = TOTAL; window.__setTime(nx); window.__done = true; return; }
        window.__setTime(nx);
        raf = requestAnimationFrame(step);
      };
      window.__done = false;
      raf = requestAnimationFrame(step);
    };
  }, []);
  const ctx = React.useMemo(() => ({ time: t, duration: TOTAL, playing: false, setTime: setT, setPlaying: () => {} }), [t]);
  return (
    <div id="rfp-canvas" style={{ position: 'fixed', top: 0, left: 0, width: 1280, height: 720,
      background: C.bg, overflow: 'hidden', fontFamily: F.ui, color: C.inv }}>
      <TimelineContext.Provider value={ctx}><Movie /></TimelineContext.Provider>
    </div>
  );
}

if (RENDER) {
  ReactDOM.createRoot(document.getElementById('root')).render(<RenderStage />);
} else {
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Stage width={1280} height={720} duration={TOTAL} background={C.bg} persistKey="smartrfp-combined">
      <Movie />
    </Stage>
  );
}
window.__TOTAL = TOTAL;
</script>
</body>
</html>

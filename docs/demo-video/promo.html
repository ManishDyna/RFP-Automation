<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartRFP — 30s Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #FFFFFF; overflow: hidden; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script>window.__PROD_REACT = new URLSearchParams(location.search).get('render') === '1';</script>
<script>
  (function () {
    var base = 'https://unpkg.com/';
    var rv = window.__PROD_REACT ? 'react@18.3.1/umd/react.production.min.js' : 'react@18.3.1/umd/react.development.js';
    var rdv = window.__PROD_REACT ? 'react-dom@18.3.1/umd/react-dom.production.min.js' : 'react-dom@18.3.1/umd/react-dom.development.js';
    document.write('<scr' + 'ipt src="' + base + rv + '" crossorigin="anonymous"></scr' + 'ipt>');
    document.write('<scr' + 'ipt src="' + base + rdv + '" crossorigin="anonymous"></scr' + 'ipt>');
  })();
</script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="animations.jsx"></script>

<script type="text/babel">
const SHOT = 'assets/shots/';
// ── Light SaaS palette ──────────────────────────────────────────────────────
const K = {
  white:'#FFFFFF', paper:'#F4F7FC', ink:'#0B1A38', text:'#33415A', mute:'#647089', faint:'#9AA6BC',
  line:'#E4EAF3', line2:'#EEF2F8', blue:'#1D4ED8', blueDk:'#1740B0', blueSoft:'#EAF0FE',
  cyan:'#06B6D4', grad:'linear-gradient(120deg,#2563EB 0%,#06B6D4 100%)', grad2:'linear-gradient(120deg,#2563EB,#7C3AED)',
  green:'#0FA968', red:'#E0524B',
};
const FONT = "'Manrope', system-ui, sans-serif";
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(time,s,d)=>clamp((time-s)/d,0,1);
const E=Easing;

// ── Timeline ─────────────────────────────────────────────────────────────────
const S = { problem:[0,5], reveal:[5,9], f1:[9,12.75], f2:[12.75,16.5], f3:[16.5,20.25], f4:[20.25,24], result:[24,28], close:[28,30] };
const TOTAL = 30;

// ── Helpers ───────────────────────────────────────────────────────────────────
function Appear({ at=0, dur=0.5, y=24, x=0, sc=0, ease=E.easeOutCubic, style={}, children }) {
  const t = useTime(); const p = ease(seg(t, at, dur));
  const s = sc ? lerp(1-sc,1,p) : 1;
  return <div style={{ opacity:p, transform:`translate(${(1-p)*x}px,${(1-p)*y}px)`+(s!==1?` scale(${s})`:''), willChange:'transform,opacity', ...style }}>{children}</div>;
}
function CountUp({ to, from=0, at=0, dur=1.0, decimals=0, prefix='', suffix='', style }) {
  const t = useTime(); const p = E.easeOutCubic(seg(t, at, dur)); const v = lerp(from,to,p);
  return <span style={style}>{prefix}{decimals?v.toFixed(decimals):Math.round(v)}{suffix}</span>;
}
function Mark({ size=64, stack=false }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:size*0.26, flexDirection:stack?'column':'row' }}>
      <div style={{ width:size, height:size, borderRadius:size*0.28, background:K.grad,
        display:'flex', alignItems:'center', justifyContent:'center',
        boxShadow:'0 12px 30px rgba(37,99,235,0.35), inset 0 1px 0 rgba(255,255,255,0.4)' }}>
        <svg width={size*0.6} height={size*0.6} viewBox="0 0 24 24" fill="none">
          <path d="M5 16.5 L12 6 L19 16.5" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/>
          <circle cx="12" cy="19" r="1.7" fill="#fff"/>
        </svg>
      </div>
      <div style={{ fontFamily:FONT, fontWeight:800, fontSize:size*0.66, letterSpacing:'-0.03em', color:K.ink, lineHeight:1 }}>
        Smart<span style={{ background:K.grad, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>RFP</span>
      </div>
    </div>
  );
}
// Browser frame (light)
function Frame({ x, y, w, h, url='app.smartrfp.io', children, style={} }) {
  return (
    <div style={{ position:'absolute', left:x, top:y, width:w, height:h, background:K.white, borderRadius:18, overflow:'hidden',
      boxShadow:'0 50px 110px rgba(15,30,70,0.18), 0 0 0 1px rgba(15,30,70,0.05)', display:'flex', flexDirection:'column', ...style }}>
      <div style={{ height:46, background:'#F1F4FA', borderBottom:`1px solid ${K.line}`, display:'flex', alignItems:'center', padding:'0 18px', gap:9, flexShrink:0 }}>
        <div style={{ display:'flex', gap:8 }}>{['#FF5F57','#FEBC2E','#28C840'].map(c=><div key={c} style={{ width:12, height:12, borderRadius:99, background:c }}/>)}</div>
        <div style={{ flex:1, display:'flex', justifyContent:'center' }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, height:27, minWidth:360, padding:'0 16px', background:'#fff', borderRadius:8, border:`1px solid ${K.line}`, fontFamily:FONT, fontSize:13, color:K.mute, fontWeight:600 }}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 1112 0v2" stroke={K.green} strokeWidth="2"/><rect x="4" y="10" width="16" height="10" rx="2" fill={K.green} opacity="0.16"/><rect x="4" y="10" width="16" height="10" rx="2" stroke={K.green} strokeWidth="1.6"/></svg>
            {url}
          </div>
        </div>
        <div style={{ width:60 }}/>
      </div>
      <div style={{ flex:1, position:'relative', overflow:'hidden', background:K.paper }}>{children}</div>
    </div>
  );
}
// Ken-Burns screenshot inside a frame's content area
function Shot({ img, t0, dur, fx=0.5, fy=0.4, s0=1.05, s1=1.16 }) {
  const t = useTime(); const p = E.easeInOutSine(seg(t, t0, dur));
  return <img src={SHOT+img} alt="" style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover',
    objectPosition:'top center', transformOrigin:`${fx*100}% ${fy*100}%`, transform:`scale(${lerp(s0,s1,p)})`, willChange:'transform' }}/>;
}
// Animated cursor
function Cursor({ path }) {
  const t = useTime(); if (!path||!path.length||t<path[0].t-0.15) return null;
  let a=path[0], b=path[path.length-1];
  for (let i=0;i<path.length-1;i++){ if(t>=path[i].t&&t<=path[i+1].t){a=path[i];b=path[i+1];break;} if(t>path[i+1].t){a=path[i+1];b=path[i+1];} }
  const sp=b.t-a.t, pr=sp>0?E.easeInOutCubic(clamp((t-a.t)/sp,0,1)):1;
  const x=lerp(a.x,b.x,pr), y=lerp(a.y,b.y,pr);
  let ring=null;
  for (const pt of path){ if(pt.click&&t>=pt.t&&t<pt.t+0.5){ const c=seg(t,pt.t,0.5); ring={o:1-c,s:0.4+c*1.4,x:pt.x,y:pt.y}; } }
  return (<div style={{ position:'absolute', inset:0, zIndex:30, pointerEvents:'none' }}>
    {ring&&<div style={{ position:'absolute', left:ring.x, top:ring.y, width:54, height:54, marginLeft:-27, marginTop:-27, borderRadius:99, border:`3px solid ${K.blue}`, opacity:ring.o, transform:`scale(${ring.s})` }}/>}
    <svg width="34" height="34" viewBox="0 0 24 24" style={{ position:'absolute', left:x, top:y, filter:'drop-shadow(0 4px 6px rgba(0,0,0,0.25))' }}>
      <path d="M5 3l14 7-6 1.6L9.6 18 5 3z" fill="#fff" stroke={K.ink} strokeWidth="1.1" strokeLinejoin="round"/></svg>
  </div>);
}
// Gate: render only within window, fade edges
function Gate({ t0, dur, fade=0.4, style={}, children }) {
  const t = useTime(); const lt = t - t0;
  if (lt < -fade || lt > dur + fade) return null;
  let op = 1;
  if (lt < fade) op = clamp(lt/fade,0,1); else if (lt > dur-fade) op = clamp((dur-lt)/fade,0,1);
  return <div style={{ position:'absolute', inset:0, opacity:op, ...style }}>{children}</div>;
}

// ── SCENE 1 — Problem (0–5s) ─────────────────────────────────────────────────
function DocCard({ x, y, rot, at }) {
  return (
    <Appear at={at} dur={0.5} y={-30} sc={0.12} style={{ position:'absolute', left:x, top:y, transform:`rotate(${rot}deg)` }}>
      <div style={{ width:230, height:300, background:'#fff', borderRadius:12, border:'1px solid #DfE4EC', boxShadow:'0 24px 50px rgba(20,30,50,0.12)', padding:20, transform:`rotate(${rot}deg)`, filter:'grayscale(0.7)' }}>
        <div style={{ width:'55%', height:12, background:'#C9D2DE', borderRadius:4, marginBottom:14 }}/>
        {[...Array(7)].map((_,i)=><div key={i} style={{ width:`${90-(i%3)*12}%`, height:7, background:'#E3E8EF', borderRadius:3, marginBottom:9 }}/>)}
      </div>
    </Appear>
  );
}
function SceneProblem() {
  const [t0,t1]=S.problem; const t=useTime(); const lt=t-t0;
  return (
    <Gate t0={t0} dur={t1-t0} style={{ background:'#EEF1F5' }}>
      {/* faint cluttered tabs */}
      <Appear at={t0+0.1} dur={0.5} style={{ position:'absolute', top:60, left:'50%', transform:'translateX(-50%)', display:'flex', gap:3 }}>
        {[...Array(11)].map((_,i)=><div key={i} style={{ width:120, height:34, background:i===3?'#fff':'#E2E7EE', borderRadius:'8px 8px 0 0', border:'1px solid #D3DAE4', display:'flex', alignItems:'center', padding:'0 10px', gap:6 }}>
          <div style={{ width:12, height:12, borderRadius:3, background:'#C2CBD7' }}/><div style={{ flex:1, height:6, background:'#CBD3DE', borderRadius:3 }}/></div>)}
      </Appear>
      {/* scattered docs */}
      <DocCard x={430} y={250} rot={-9} at={t0+0.3}/>
      <DocCard x={760} y={300} rot={5} at={t0+0.6}/>
      <DocCard x={1090} y={250} rot={-4} at={t0+0.9}/>
      <DocCard x={620} y={420} rot={8} at={t0+1.2}/>
      <DocCard x={980} y={430} rot={-7} at={t0+1.5}/>
      {/* deadline pill */}
      <Appear at={t0+0.8} dur={0.5} sc={0.1} style={{ position:'absolute', top:150, right:120 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, background:'#fff', border:`2px solid ${K.red}`, borderRadius:14, padding:'14px 22px', boxShadow:'0 18px 40px rgba(224,82,75,0.2)' }}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke={K.red} strokeWidth="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
          <div><div style={{ fontFamily:FONT, fontWeight:800, fontSize:18, color:K.red, opacity:0.6+0.4*Math.abs(Math.sin(lt*3)) }}>Deadline: 1 day</div>
          <div style={{ fontFamily:FONT, fontSize:13, color:K.mute }}>5 RFPs still open</div></div>
        </div>
      </Appear>
      {/* headline */}
      <Appear at={t0+1.8} dur={0.6} y={20} style={{ position:'absolute', bottom:150, left:0, right:0, textAlign:'center' }}>
        <div style={{ fontFamily:FONT, fontWeight:800, fontSize:62, letterSpacing:'-0.03em', color:K.ink }}>RFPs shouldn't take all week.</div>
        <div style={{ fontFamily:FONT, fontWeight:500, fontSize:24, color:K.mute, marginTop:14 }}>Hours of re-keying. Versions everywhere. Deadlines slipping.</div>
      </Appear>
    </Gate>
  );
}

// ── SCENE 2 — Reveal (5–9s) ──────────────────────────────────────────────────
function SceneReveal() {
  const [t0,t1]=S.reveal; const t=useTime(); const lt=t-t0;
  const logoUp = E.easeInOutCubic(clamp((lt-1.0)/0.7,0,1)); // logo moves center -> top
  return (
    <Gate t0={t0} dur={t1-t0}>
      {/* white sweep */}
      <div style={{ position:'absolute', inset:0, background:K.white }}/>
      {/* logo: center then settle up */}
      <div style={{ position:'absolute', left:'50%', top:lerp(440,70,logoUp), transform:`translate(-50%,-50%) scale(${lerp(1,0.5,logoUp)})`, opacity:clamp(lt/0.4,0,1) }}>
        <Mark size={92}/>
      </div>
      {/* dashboard glides in */}
      <Appear at={t0+1.3} dur={0.7} y={70} sc={0.06}>
        <Frame x={300} y={210} w={1320} h={760} url="app.smartrfp.io/dashboard">
          <Shot img="Dashboard.png" t0={t0+1.3} dur={t1-t0} fx={0.5} fy={0.18} s0={1.02} s1={1.08}/>
        </Frame>
      </Appear>
      <Appear at={t0+2.4} dur={0.5} style={{ position:'absolute', bottom:60, left:0, right:0, textAlign:'center' }}>
        <div style={{ fontFamily:FONT, fontWeight:700, fontSize:26, color:K.text }}>One portal. The whole RFP pipeline.</div>
      </Appear>
    </Gate>
  );
}

// ── SCENE 3 — Features (9–24s) ───────────────────────────────────────────────
function Feature({ win, idx, img, fx, fy, cap, accent, cursor }) {
  const [t0,t1]=win; const dur=t1-t0;
  const [pre,key]=cap;
  return (
    <Gate t0={t0} dur={dur}>
      <div style={{ position:'absolute', inset:0, background:K.white }}/>
      {/* counter + soft accent blob */}
      <Appear at={t0+0.15} dur={0.5} style={{ position:'absolute', top:64, left:300, display:'flex', alignItems:'center', gap:14 }}>
        <span style={{ fontFamily:FONT, fontWeight:800, fontSize:18, background:K.grad, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>{String(idx).padStart(2,'0')}</span>
        <span style={{ width:40, height:2, background:K.line }}/>
        <span style={{ fontFamily:FONT, fontWeight:700, fontSize:14, letterSpacing:'0.18em', textTransform:'uppercase', color:K.faint }}>Feature {idx} of 4</span>
      </Appear>
      <Appear at={t0+0.2} dur={0.6} y={50} sc={0.04}>
        <Frame x={300} y={120} w={1320} h={720} url={cursor?cursor.url:'app.smartrfp.io'}>
          <Shot img={img} t0={t0} dur={dur} fx={fx} fy={fy} s0={1.06} s1={1.17}/>
          {cursor && <Cursor path={cursor.path.map(p=>({...p,t:t0+p.t}))}/>}
        </Frame>
      </Appear>
      {/* kinetic caption */}
      <Appear at={t0+0.55} dur={0.6} y={26} style={{ position:'absolute', bottom:62, left:0, right:0, textAlign:'center' }}>
        <div style={{ fontFamily:FONT, fontWeight:800, fontSize:50, letterSpacing:'-0.03em', color:K.ink }}>
          {pre} <span style={{ background:K.grad, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>{key}</span>
        </div>
      </Appear>
    </Gate>
  );
}

// ── SCENE 4 — Result (24–28s) ────────────────────────────────────────────────
function StatTile({ at, value, label }) {
  return (
    <Appear at={at} dur={0.6} y={30} sc={0.08}>
      <div style={{ width:360, padding:'34px 30px', background:K.white, borderRadius:20, border:`1px solid ${K.line}`, boxShadow:'0 30px 70px rgba(15,30,70,0.10)', textAlign:'center' }}>
        <div style={{ fontFamily:FONT, fontWeight:800, fontSize:64, letterSpacing:'-0.03em', background:K.grad, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>{value}</div>
        <div style={{ fontFamily:FONT, fontWeight:600, fontSize:19, color:K.mute, marginTop:6 }}>{label}</div>
      </div>
    </Appear>
  );
}
function SceneResult() {
  const [t0,t1]=S.result;
  return (
    <Gate t0={t0} dur={t1-t0}>
      <div style={{ position:'absolute', inset:0, background:K.paper }}/>
      <Appear at={t0+0.2} dur={0.6} sc={0.2} style={{ position:'absolute', top:150, left:'50%', transform:'translateX(-50%)' }}>
        <div style={{ width:96, height:96, borderRadius:99, background:K.grad, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 20px 50px rgba(37,99,235,0.4)' }}>
          <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
      </Appear>
      <Appear at={t0+0.5} dur={0.5} style={{ position:'absolute', top:280, left:0, right:0, textAlign:'center' }}>
        <div style={{ fontFamily:FONT, fontWeight:800, fontSize:48, letterSpacing:'-0.03em', color:K.ink }}>Submitted — with time to spare.</div>
      </Appear>
      <div style={{ position:'absolute', top:400, left:0, right:0, display:'flex', justifyContent:'center', gap:30 }}>
        <StatTile at={t0+1.0} value={<><CountUp to={70} at={t0+1.1} dur={1.0}/>%</>} label="faster, receipt to bidder"/>
        <StatTile at={t0+1.25} value={<><CountUp to={2} at={t0+1.35} dur={1.0}/>×</>} label="more bids worked"/>
        <StatTile at={t0+1.5} value={<CountUp to={0} from={9} at={t0+1.6} dur={1.0}/>} label="deadlines missed"/>
      </div>
    </Gate>
  );
}

// ── SCENE 5 — Close (28–30s) ─────────────────────────────────────────────────
function SceneClose() {
  const [t0,t1]=S.close;
  return (
    <Gate t0={t0} dur={t1-t0}>
      <div style={{ position:'absolute', inset:0, background:K.white }}/>
      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:26 }}>
        <Appear at={t0+0.15} dur={0.6} sc={0.12}><Mark size={108}/></Appear>
        <Appear at={t0+0.5} dur={0.5} y={14}><div style={{ fontFamily:FONT, fontWeight:600, fontSize:27, color:K.text }}>From RFP to quote — automated.</div></Appear>
        <Appear at={t0+0.8} dur={0.5} sc={0.06} y={10}>
          <div style={{ marginTop:8, display:'inline-flex', alignItems:'center', gap:12, padding:'17px 34px', borderRadius:14, background:K.grad, color:'#fff', fontFamily:FONT, fontWeight:800, fontSize:21, boxShadow:'0 18px 44px rgba(37,99,235,0.4)' }}>
            Start automating today
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>
        </Appear>
      </div>
    </Gate>
  );
}

// ── Movie + progress ──────────────────────────────────────────────────────────
function Progress() {
  const t = useTime();
  return (<>
    <div style={{ position:'absolute', bottom:0, left:0, right:0, height:5, background:'rgba(15,30,70,0.06)', zIndex:50 }}>
      <div style={{ width:`${(t/TOTAL)*100}%`, height:'100%', background:K.grad }}/>
    </div>
    <div style={{ position:'absolute', top:30, right:40, zIndex:50, opacity:0.9 }}><Mark size={26}/></div>
  </>);
}
function Movie() {
  return (
    <>
      <SceneProblem/>
      <SceneReveal/>
      <Feature win={S.f1} idx={1} img="RFP-insight-screen.png" fx={0.42} fy={0.32} cap={['Finds the right RFPs','— automatically.']} />
      <Feature win={S.f2} idx={2} img="Material-Matching-screen.png" fx={0.48} fy={0.42} cap={['Matches every BOQ line','to your materials.']} />
      <Feature win={S.f3} idx={3} img="open-rfps-page.png" fx={0.6} fy={0.4} cap={['Routes to bidders.','Guards every deadline.']} />
      <Feature win={S.f4} idx={4} img="Submit-RFP-page.png" fx={0.5} fy={0.5}
        cap={['Submit back to the portal','— in one click.']}
        cursor={{ url:'app.smartrfp.io/submit', path:[{t:0.6,x:760,y:420},{t:2.6,x:980,y:560},{t:3.0,x:980,y:560,click:true},{t:3.5,x:980,y:560}] }} />
      <SceneResult/>
      <SceneClose/>
      <Progress/>
    </>
  );
}

// ── Render harness (shared with render.py) ────────────────────────────────────
const RENDER = new URLSearchParams(location.search).get('render') === '1';
function RenderStage() {
  const [t,setT]=React.useState(0); const tRef=React.useRef(0);
  React.useEffect(()=>{
    window.__setTime=(x)=>{ tRef.current=x; setT(x); };
    window.__duration=TOTAL; window.__ready=true;
    window.__play=()=>{ let last=null,raf; const step=(ts)=>{ if(last==null)last=ts; const dt=(ts-last)/1000; last=ts;
      let nx=tRef.current+dt; if(nx>=TOTAL){ nx=TOTAL; window.__setTime(nx); window.__done=true; return; } window.__setTime(nx); raf=requestAnimationFrame(step); };
      window.__done=false; raf=requestAnimationFrame(step); };
  },[]);
  const ctx=React.useMemo(()=>({ time:t, duration:TOTAL, playing:false, setTime:setT, setPlaying:()=>{} }),[t]);
  return <div id="rfp-canvas" style={{ position:'fixed', top:0, left:0, width:1920, height:1080, background:K.white, overflow:'hidden', fontFamily:FONT, color:K.ink }}>
    <TimelineContext.Provider value={ctx}><Movie/></TimelineContext.Provider></div>;
}
if (RENDER) {
  ReactDOM.createRoot(document.getElementById('root')).render(<RenderStage/>);
} else {
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Stage width={1920} height={1080} duration={TOTAL} background={K.white} persistKey="smartrfp-promo"><Movie/></Stage>
  );
}
window.__TOTAL = TOTAL;
</script>
</body>
</html>
